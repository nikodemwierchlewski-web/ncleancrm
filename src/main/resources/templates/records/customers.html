<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><script src="/js/records.js" defer></script><title>ncLEAN CRM</title></head><body><header class="app-header"><a class="brand" href="/calendar"><span>NCLEAN</span><b>CRM</b></a><nav class="record-nav"><a href="/calendar">Kalendarz</a><a href="/orders">Zlecenia</a><a href="/customers">Klienci</a><a href="/settings/services">Cennik</a></nav><form th:action="@{/logout}" method="post"><button class="button secondary">Wyloguj</button></form></header><main class="main records"><h1>Klienci</h1><p>Kartoteka kontaktów. Zmiana danych nie przepisuje wcześniejszych zleceń. Numer może należeć do kilku osób.</p><form class="search" th:action="@{/customers/search}" method="post"><label>Szukaj po nazwie lub telefonie<input name="query" maxlength="120"></label><button class="button secondary">Szukaj</button></form><details class="card"><summary>Dodaj klienta</summary><form th:action="@{/customers}" method="post" th:with="person=${null}"><label>Imię / nazwa<input name="name" required maxlength="120" th:value="${person != null ? person.name : ''}"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" th:value="${person != null ? person.phone : ''}"></label><label>Adres domyślny<input name="address" maxlength="240" th:value="${person != null ? person.address : ''}"></label><label>Notatka<textarea name="notes" maxlength="2000" th:text="${person != null ? person.notes : ''}"></textarea></label><button class="button primary">Dodaj klienta</button></form></details><article class="card" th:each="person:${customers}"><h2 th:text="${person.name}"></h2><p><span th:text="${person.phone}"></span> · <span th:text="${person.active ? 'Aktywny' : 'Nieaktywny'}"></span></p><a th:href="@{/orders(customer=${person.id})}">Historia zleceń</a><details><summary>Edytuj dane</summary><form th:action="@{/customers}" method="post"><input type="hidden" name="id" th:value="${person.id}"><input type="hidden" name="version" th:value="${person.version}"><label>Imię / nazwa<input name="name" required maxlength="120" th:value="${person != null ? person.name : ''}"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" th:value="${person != null ? person.phone : ''}"></label><label>Adres domyślny<input name="address" maxlength="240" th:value="${person != null ? person.address : ''}"></label><label>Notatka<textarea name="notes" maxlength="2000" th:text="${person != null ? person.notes : ''}"></textarea></label><label class="check"><input type="checkbox" name="active" th:checked="${person.active}">Aktywny</label><button class="button primary">Zapisz klienta</button></form></details></article></main></body></html>
