<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><script src="/js/records.js" defer></script><title>ncLEAN CRM</title><script src="/js/app.js" defer></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#208be3"><link rel="apple-touch-icon" href="/pwa/icon-192.png"><link rel="stylesheet" href="/css/interface.css"><script src="/js/interface.js" defer></script><th:block th:replace="~{fragments/theme :: assets}"></th:block></head><body><header th:replace="~{fragments/navigation :: header('customers')}"></header><main class="main records"><h1>Klienci</h1><div class="actions"><a class="button secondary" href="/search">Szukaj w CRM</a><a class="button secondary" href="/callbacks">Ponowny kontakt</a></div><p class="page-intro">Kontakty i historia wizyt w jednym miejscu.</p><form class="search" th:action="@{/customers}" method="get"><label>Szukaj po nazwie lub telefonie<input name="query" type="search" maxlength="120" th:value="${query}"></label><button class="button secondary">Szukaj</button></form><details class="card"><summary>Dodaj klienta</summary><form th:action="@{/customers}" method="post" th:with="person=${null}"><label>Imię / nazwa<input name="name" required maxlength="120" th:value="${person != null ? person.name : ''}"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" th:value="${person != null ? person.phone : ''}"></label><label>Adres domyślny<input name="address" maxlength="240" th:value="${person != null ? person.address : ''}"></label><label>Źródło klienta<select name="source"><option th:each="s:${T(pl.nclean.crm.context.ContextService).SOURCES}" th:value="${s.key}" th:text="${s.value}" th:selected="${person != null and person.source == s.key}"></option></select></label><label>Polecenie — od kogo<input name="referral_note" maxlength="200" th:value="${person != null ? person.referral_note : ''}"></label><label>Notatka<textarea name="notes" maxlength="2000" th:text="${person != null ? person.notes : ''}"></textarea></label><button class="button primary">Dodaj klienta</button></form></details><article class="card" th:each="person:${customers}"><h2 th:text="${person.name}"></h2><p><span th:text="${person.phone}"></span> · <span th:text="${person.active ? 'Aktywny' : 'Nieaktywny'}"></span></p><a th:href="@{/customers/{id}(id=${person.id})}" class="text-link">Otwórz kartotekę →</a><details><summary>Edytuj dane</summary><form th:action="@{/customers}" method="post"><input type="hidden" name="id" th:value="${person.id}"><input type="hidden" name="version" th:value="${person.version}"><label>Imię / nazwa<input name="name" required maxlength="120" th:value="${person != null ? person.name : ''}"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" th:value="${person != null ? person.phone : ''}"></label><label>Adres domyślny<input name="address" maxlength="240" th:value="${person != null ? person.address : ''}"></label><label>Źródło klienta<select name="source"><option th:each="s:${T(pl.nclean.crm.context.ContextService).SOURCES}" th:value="${s.key}" th:text="${s.value}" th:selected="${person != null and person.source == s.key}"></option></select></label><label>Polecenie — od kogo<input name="referral_note" maxlength="200" th:value="${person != null ? person.referral_note : ''}"></label><label>Notatka<textarea name="notes" maxlength="2000" th:text="${person != null ? person.notes : ''}"></textarea></label><label class="check"><input type="checkbox" name="active" th:checked="${person.active}">Aktywny</label><button class="button primary">Zapisz klienta</button></form></details></article></main></body></html>
