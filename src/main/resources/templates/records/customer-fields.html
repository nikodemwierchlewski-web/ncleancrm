<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="fields"><label>Imię / nazwa<input name="name" required maxlength="120" th:value="${person != null ? person.name : ''}"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" th:value="${person != null ? person.phone : ''}"></label><label>Adres domyślny<input name="address" maxlength="240" th:value="${person != null ? person.address : ''}"></label><label>Źródło klienta<select name="source"><option th:each="s:${T(pl.nclean.crm.context.ContextService).SOURCES}" th:value="${s.key}" th:text="${s.value}" th:selected="${person != null and person.source == s.key}"></option></select></label><label>Polecenie — od kogo<input name="referral_note" maxlength="200" th:value="${person != null ? person.referral_note : ''}"></label><label>Notatka<textarea name="notes" maxlength="2000" th:text="${person != null ? person.notes : ''}"></textarea></label></th:block></body></html>
