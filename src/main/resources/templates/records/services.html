<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><script src="/js/records.js" defer></script><title>ncLEAN CRM</title></head><body><header class="app-header"><a class="brand" href="/calendar"><span>NCLEAN</span><b>CRM</b></a><nav class="record-nav"><a href="/calendar">Kalendarz</a><a href="/orders">Zlecenia</a><a href="/customers">Klienci</a><a href="/settings/services">Cennik</a></nav><form th:action="@{/logout}" method="post"><button class="button secondary">Wyloguj</button></form></header><main class="main records"><h1>Edytowalny cennik</h1><p>Początkowe ceny są przykładowe. Zmiany dotyczą nowych wycen; zapisane zlecenia zachowują swoje ceny. Nieaktywne usługi pozostają w historii.</p><details class="card"><summary>Kategorie — dodaj lub zmień nazwę</summary><form th:action="@{/settings/services/category}" method="post"><label>Nowa kategoria<input name="name" required maxlength="100"></label><button class="button primary">Dodaj kategorię</button></form><form th:each="cat:${categories}" th:action="@{/settings/services/category}" method="post"><input type="hidden" name="id" th:value="${cat.id}"><label>Nazwa kategorii<input name="name" required maxlength="100" th:value="${cat.name}"></label><button class="button secondary">Zmień nazwę</button></form></details><details class="card"><summary>Dodaj usługę</summary><form th:action="@{/settings/services}" method="post" th:with="service=${null}"><label>Kategoria<select name="category" required><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${service != null and cat.id == service.category_id}"></option></select></label><label>Nazwa usługi<input name="name" required maxlength="120" th:value="${service != null ? service.name : ''}"></label><label>Jednostka (np. szt., m², pakiet)<input name="unit" required maxlength="20" th:value="${service != null ? service.unit : 'szt.'}"></label><label>Kwota do zapłaty PLN<input name="price" type="number" min="0" max="9999999999.99" step="0.01" required th:value="${service != null ? service.price : 0}"></label><label>Czas na jednostkę (min)<input name="minutes" type="number" min="1" max="1440" required th:value="${service != null ? service.minutes : 60}"></label><button class="button primary">Dodaj usługę</button></form></details><article class="card" th:each="service:${services}"><h2 th:text="${service.name}"></h2><p><span th:text="${service.category}"></span> · <b th:text="|${service.price} zł / ${service.unit}|"></b> · <span th:text="${service.active ? 'Aktywna' : 'Nieaktywna'}"></span></p><details><summary>Edytuj usługę</summary><form th:action="@{/settings/services}" method="post"><input type="hidden" name="id" th:value="${service.id}"><input type="hidden" name="version" th:value="${service.version}"><label>Kategoria<select name="category" required><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${service != null and cat.id == service.category_id}"></option></select></label><label>Nazwa usługi<input name="name" required maxlength="120" th:value="${service != null ? service.name : ''}"></label><label>Jednostka (np. szt., m², pakiet)<input name="unit" required maxlength="20" th:value="${service != null ? service.unit : 'szt.'}"></label><label>Kwota do zapłaty PLN<input name="price" type="number" min="0" max="9999999999.99" step="0.01" required th:value="${service != null ? service.price : 0}"></label><label>Czas na jednostkę (min)<input name="minutes" type="number" min="1" max="1440" required th:value="${service != null ? service.minutes : 60}"></label><label class="check"><input type="checkbox" name="active" th:checked="${service.active}">Aktywna — dostępna przy nowych zleceniach</label><button class="button primary">Zapisz usługę</button></form></details></article></main></body></html>
