<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><form th:fragment="booking" id="booking-form" th:action="@{/orders}" method="post"><input type="hidden" name="token" th:value="${token}"><h2>1. Kategoria i usługi</h2><label>Kategoria<select id="booking-category"><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}"></option></select></label><div class="service-line" th:each="service:${services}" th:if="${service.active}" th:attr="data-category=${service.category_id},data-price=${service.price}"><label><strong th:text="${service.name}"></strong><span th:text="|${service.price} zł / ${service.unit} · ${service.minutes} min|"></span><input type="number" min="0" max="10000" step="0.01" value="0" th:name="|qty_${service.id}|" th:attr="aria-label=|Ilość: ${service.name}|"></label></div><p class="quote">Suma: <strong id="booking-total">0,00 zł</strong></p><h2>2. Klient</h2><label>Szukaj klienta po imieniu lub telefonie<input id="customer-search" autocomplete="off" type="search"></label><select name="customer" id="booking-customer" aria-label="Wybierz klienta"><option value="">Nowy klient — wpisz dane poniżej</option></select><div id="new-customer"><label>Imię / nazwa<input name="name" required maxlength="120" autocomplete="name"></label><label>Telefon<input name="phone" type="tel" required maxlength="30" autocomplete="tel"></label></div><h2>3. Adres i termin</h2><label>Adres realizacji<input id="booking-address" name="address" required maxlength="240" autocomplete="street-address"></label><label>Dzień<input name="day" type="date" min="2000-01-01" max="2100-12-31" required th:value="${day}"></label><label>Godzina<input name="starts" type="time" required value="09:00"></label><button class="button primary">Zapisz zlecenie</button><p id="customer-search-status" role="status"></p></form></body></html>
