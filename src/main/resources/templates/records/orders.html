<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><script src="/js/records.js" defer></script><script src="/js/forecast.js" defer></script><title>ncLEAN CRM</title></head><body><header th:replace="~{fragments/navigation :: header('calendar')}"></header><main class="main records"><h1>Zlecenia</h1><p>Wybierz kategorię i usługi, a następnie klienta i adres. Kwoty są zapisywane jako uzgodniona wycena.</p><details class="card" id="new-order" open><summary>Dodaj zlecenie</summary><form th:replace="~{records/booking :: booking}"></form></details><form class="search" action="/orders" method="get"><label>Dzień<input name="day" type="date" th:value="${day}"></label><button class="button secondary">Pokaż dzień</button><a href="/orders">Wszystkie zlecenia</a></form><p th:if="${orders.isEmpty()}">Brak zapisanych zleceń.</p><article class="card" th:each="order:${orders}"><h2><span th:text="${order.day}"></span> · <span th:text="${order.starts}"></span></h2><p><strong th:text="${order.customer_name}"></strong> · <span th:text="${order.phone}"></span></p><p th:text="${order.address}"></p><ul><li th:each="line:${lines.get(order.id)}"><span th:text="|${line.name}: ${line.quantity} ${line.unit} × ${line.price} zł = ${line.amount} zł|"></span></li></ul><p><strong th:text="|Razem: ${order.total} zł|"></strong></p><section th:replace="~{records/forecast-details :: details(${order},${bookingChemicals.get(order.id)})}"></section><details><summary>Zmień termin lub status</summary><p>Wycena i dane ustalone przy rezerwacji pozostają zachowane.</p><form th:action="@{/orders/{id}(id=${order.id})}" method="post"><input type="hidden" name="version" th:value="${order.version}"><label>Dzień<input name="day" type="date" required min="2000-01-01" max="2100-12-31" th:value="${order.day}"></label><label>Godzina<input name="starts" type="time" required th:value="${order.starts}"></label><label>Status<select name="status"><option th:each="s:${ {'PLANNED','DONE','CANCELLED'} }" th:value="${s}" th:selected="${s == order.status}" th:text="${s == 'PLANNED' ? 'Zaplanowane' : (s == 'DONE' ? 'Wykonane' : 'Anulowane')}"></option></select></label><button class="button primary">Zapisz zmiany</button></form></details></article></main></body></html>
