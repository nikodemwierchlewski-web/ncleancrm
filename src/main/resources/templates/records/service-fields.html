<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<form th:fragment="fields(service,selectedCategory)" th:action="@{/settings/services}" method="post">
 <input th:if="${service != null}" type="hidden" name="id" th:value="${service.id}"><input th:if="${service != null}" type="hidden" name="version" th:value="${service.version}">
 <label>Kategoria<select name="category" required><option th:each="category:${categories}" th:value="${category.id}" th:selected="${category.id == selectedCategory}" th:text="${category.name}"></option></select></label>
 <label>Nazwa usługi<input name="name" required maxlength="120" th:value="${service == null ? '' : service.name}"></label>
 <label>Jednostka<input name="unit" required maxlength="20" th:value="${service == null ? 'szt.' : service.unit}"></label>
 <label>Sugerowana cena jednostkowa PLN<input name="price" type="number" min="0" max="9999999999.99" step="0.01" required th:value="${service == null ? '' : service.price}"></label>
 <label>Czas na jednostkę (min)<input name="minutes" type="number" min="1" max="1440" required th:value="${service == null ? 60 : service.minutes}"></label>
 <label th:if="${service != null}" class="check"><input type="checkbox" name="active" th:checked="${service.active}">Aktywna przy nowych zleceniach</label>
 <button class="button primary" th:text="${service == null ? 'Dodaj usługę' : 'Zapisz usługę'}"></button>
</form></body></html>
