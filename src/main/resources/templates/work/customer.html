<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historia klienta · ncLEAN</title><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><link rel="stylesheet" href="/css/work.css"><script src="/js/app.js" defer></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#208be3"><link rel="apple-touch-icon" href="/pwa/icon-192.png"><link rel="stylesheet" href="/css/interface.css"><script src="/js/interface.js" defer></script></head><body><header th:replace="~{fragments/navigation :: header('customers')}"></header><main class="main records"><h1 th:text="${person.name}"></h1><a class="text-link" th:href="'tel:'+${person.phone}" th:text="${person.phone}"></a><p th:text="${person.address}"></p><p th:text="${person.notes}"></p><a class="button secondary" href="/customers">Edytuj kartotekę</a><h2>Wizyty</h2><article class="card" th:each="o:${orders}"><h3 th:text="${o.day+' · '+(o.status == 'DONE' ? 'Wykonane' : (o.status == 'CANCELLED' ? 'Anulowane' : 'Zaplanowane'))}"></h3><p th:text="${o.service_label}"></p><p th:text="${o.address}"></p><p th:text="${'Cena '+(o.final_total != null ? o.final_total : o.total)+' zł · wpłaty '+o.paid+' zł'}"></p><div class="actions"><a class="button secondary" th:href="@{/work/{id}(id=${o.id})}">Zakres i płatności</a><a class="button primary" th:href="@{/orders(repeat=${o.id})}">Umów ponownie</a></div></article></main></body></html>
