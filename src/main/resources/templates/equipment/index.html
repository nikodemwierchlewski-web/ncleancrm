<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprzęt i pojazdy · ncLEAN</title><th:block th:replace="~{equipment/fragments :: assets}"></th:block></head><body>
<header th:replace="~{fragments/navigation :: header('settings')}"></header>
<main class="main records equipment-main" id="main-content"><header class="equipment-heading"><div><span class="eyebrow">Kartoteka ncLEAN</span><h1>Sprzęt i pojazdy</h1><p class="field-help">Liczniki, serwis i powiązane wydatki.</p></div><a class="button primary" data-equipment-edit th:href="@{/equipment/editor(type='asset')}">+ Dodaj sprzęt</a></header>
<form class="equipment-filters" th:action="@{/equipment}" method="get"><label>Szukaj<input name="q" th:value="${q}" maxlength="120" placeholder="Nazwa, model lub kategoria"></label><label>Status<select aria-label="Status" name="status"><option value="active" th:selected="${status=='active'}">Aktywne</option><option value="archived" th:selected="${status=='archived'}">Archiwalne</option><option value="all" th:selected="${status=='all'}">Wszystkie</option></select></label><button class="button secondary">Pokaż</button></form>
<div class="equipment-grid"><article class="equipment-panel" th:each="a : ${assets}" th:with="cs=${counterSummary[a.id]},next=${nextService[a.id]}"><span class="equipment-tag" th:text="${a.active?'Aktywny':'Archiwalny'}"></span><p class="eyebrow" th:text="${a.kind=='CAR'?'Samochód · diesel':a.kind=='GENERATOR'?'Agregat · benzyna':a.category}"></p><h2 th:text="${a.name}"></h2><p class="field-help" th:text="${a.model}"></p><p class="field-help" th:text="${a.historyComplete?'Historia oznaczona jako kompletna':'Historia niepełna — odczyty i szacunki są oddzielne'}"></p><div th:if="${!#lists.isEmpty(cs)}" th:with="c=${cs[0]}"><p class="equipment-number" th:text="${c.current()==null?'Brak odczytu':(c.estimated()?'≈ ':'')+c.current()+' '+c.unit}"></p><p class="field-help" th:text="${c.name+(c.estimated()?' · szacunek':' · odczyt rzeczywisty')}"></p></div><p class="field-help" th:if="${#lists.isEmpty(cs)}">Nie dodano jeszcze licznika.</p><div th:if="${next!=null}"><strong th:text="${next.title}"></strong><p class="equipment-tag" th:classappend="${next.severity}" th:text="${next.label}"></p></div><dl><div><dt>Zakupy</dt><dd th:text="${a.purchases+' zł'}"></dd></div><div><dt>Utrzymanie</dt><dd th:text="${a.maintenance+' zł'}"></dd></div></dl><a class="button primary" th:href="@{/equipment/{id}(id=${a.id})}">Otwórz kartotekę</a></article>
<p class="equipment-empty" th:if="${#lists.isEmpty(assets)}">Brak sprzętu dla wybranych filtrów. Dodaj kartotekę lub zmień filtr.</p></div>
<th:block th:insert="~{equipment/fragments :: attention(${attention})}"></th:block>
</main><div th:replace="~{equipment/fragments :: dialog}"></div></body></html>
