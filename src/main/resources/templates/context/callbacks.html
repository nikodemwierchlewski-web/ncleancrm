<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ponowny kontakt · ncLEAN</title><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><link rel="stylesheet" href="/css/interface.css"><script src="/js/app.js" defer></script><th:block th:replace="~{fragments/theme :: assets}"></th:block><script src="/js/interface.js" defer></script></head><body><header th:replace="~{fragments/navigation :: header('customers')}"></header><main class="main records"><h1>Ponowny kontakt</h1><p>Klienci bez planowanej przyszłej wizyty, z ostatnią wykonaną usługą co najmniej sześć miesięcy temu.</p><p role="alert" th:if="${error}" th:text="${error}"></p><p th:if="${customers.empty}">Obecnie nikt nie wymaga kontaktu.</p><article class="card" th:each="c:${customers}"><h2 th:text="${c.name}"></h2><p th:text="${'Ostatnia usługa: '+c.last_day}"></p><a class="button secondary" th:href="'tel:'+${c.phone}">Zadzwoń</a><a class="button secondary" th:href="@{/customers/{id}(id=${c.id})}">Historia i umówienie</a><details><summary>Zapisz kontakt</summary><form th:action="@{/callbacks/{id}(id=${c.id})}" method="post"><input type="hidden" name="version" th:value="${c.version}"><input type="hidden" name="token" th:value="${contactTokens.get(c.id)}"><label>Następny kontakt<input type="date" name="next" required th:value="${next}"></label><label>Notatka<input name="note" maxlength="1000"></label><button class="button primary">Zapisz kontakt</button></form></details></article></main></body></html>
