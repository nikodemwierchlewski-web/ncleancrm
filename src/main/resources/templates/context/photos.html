<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><details class="card service-photos" id="photos" th:fragment="photos"><summary>Zdjęcia przed i po <span th:text="${photos.size()}"></span></summary><p class="field-help" th:text="${photoTime.message}"></p><p class="field-help" th:if="${photoTime.minutes != null}" th:text="${photoTime.start+' → '+photoTime.end+' · '+photoTime.minutes+' min'}"></p><p class="field-help" th:if="${order.work_time_source == 'MANUAL' or order.work_time_source == 'TIMER'}">Zachowujemy zapisany czas ręczny lub z timera.</p>
<form id="service-photo-form" th:action="@{/work/{id}/photos(id=${order.id})}" method="post"><input type="hidden" name="version" th:value="${order.version}"><input type="hidden" name="token" th:value="${photoToken}"><label>Etap<select name="stage"><option value="BEFORE">Przed usługą</option><option value="AFTER">Po usłudze</option></select></label><label>Zdjęcia z galerii<input type="file" accept="image/jpeg,image/png" multiple data-service-files></label><label>Aparat<input type="file" accept="image/jpeg,image/png" capture="environment" data-service-files></label><button type="submit" class="button secondary">Dodaj zdjęcia</button><p class="photo-status field-help" role="status"></p><small class="field-help">JPEG/PNG do 8 MB i 20 MP na zdjęcie. Czas z nazw np. IMG_20261111_103025.jpg, w lokalnej godzinie wizyty. Nieznaną nazwę możesz zachować i wpisać czas ręcznie.</small></form>
<details><summary>Popraw godziny ręcznie</summary><form id="photo-time-form" th:action="@{/work/{id}/photo-time(id=${order.id})}" method="post"><input type="hidden" name="version" th:value="${order.version}"><label>Rozpoczęcie<input type="datetime-local" step="1" name="start" required th:value="${order.work_started_at != null ? order.work_started_at.toLocalDateTime() : photoTime.start}"></label><label>Zakończenie<input type="datetime-local" step="1" name="end" required th:value="${order.work_finished_at != null ? order.work_finished_at.toLocalDateTime() : photoTime.end}"></label><button class="button secondary" type="submit">Zapisz godziny</button><p role="status" class="photo-status"></p></form></details><div class="photo-grid"><article th:each="p:${photos}"><a th:href="@{/photos/{id}(id=${p.id})}" target="_blank" rel="noopener"><img th:src="@{/photos/{id}(id=${p.id})}" alt="Zdjęcie usługi" loading="lazy"></a><strong th:text="${p.stage == 'BEFORE' ? 'Przed' : 'Po'}"></strong><small th:text="${p.original_name}"></small><small th:text="${p.captured_at != null ? p.captured_at : 'Czas nierozpoznany'}"></small><form th:action="@{/work/{id}/photos/{photo}/delete(id=${order.id},photo=${p.id})}" method="post"><button class="button secondary" type="submit">Usuń</button></form></article></div></details></body></html>
