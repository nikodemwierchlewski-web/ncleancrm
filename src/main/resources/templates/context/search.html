<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Szukaj · ncLEAN</title><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><link rel="stylesheet" href="/css/interface.css"></head><body><header th:replace="~{fragments/navigation :: header('customers')}"></header><main class="main records"><h1>Szukaj</h1><form action="/search" method="get"><label>Klient, telefon lub adres<input type="search" name="q" th:value="${query}" minlength="2" maxlength="120" autofocus required></label><button class="button primary">Szukaj</button></form><p th:if="${#strings.length(query) gt 1 and results.empty}">Brak dopasowań.</p><a class="context-result" th:each="r:${results}" th:href="${r.type == 'customer' ? '/customers/'+r.id : '/work/'+r.id}"><small th:text="${r.type == 'customer' ? 'Klient' : 'Zlecenie'}"></small><strong th:text="${r.title}"></strong><span th:text="${r.detail}"></span></a></main></body></html>
