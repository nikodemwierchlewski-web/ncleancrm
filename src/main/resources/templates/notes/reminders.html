<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="list" class="today-reminders" id="today-reminders" aria-labelledby="reminders-title"><header><h2 id="reminders-title">Przypomnienia</h2><a class="text-link" th:href="@{/notes}">Ustaw</a></header><p class="field-help">Na teraz · czas w Polsce</p><div data-reminder-list><p class="field-help" th:if="${reminders.empty}">Wszystko na bieżąco. Kolejne przypomnienia pokażą się zgodnie z harmonogramem.</p><th:block th:each="r,i:${reminders}" th:if="${i.index lt 3}"><article th:replace="~{notes/reminders :: card(${r})}"></article></th:block><details th:if="${reminders.size() gt 3}"><summary th:text="${'Pokaż pozostałe ('+(reminders.size()-3)+')'}"></summary><th:block th:each="r,i:${reminders}" th:if="${i.index ge 3}"><article th:replace="~{notes/reminders :: card(${r})}"></article></th:block></details></div><p data-reminder-error class="note-error" role="alert"></p></section>
<article th:fragment="card(r)" class="reminder-card" th:attr="data-reminder=${r.id},data-revision=${r.revision},data-occurrence=${r.occurrence},data-seen=${r.seen}"><a class="reminder-title" data-note-edit th:href="@{/notes/editor(id=${r.id})}" th:text="${r.title}"></a><small class="numeric" th:text="${'Przypomnienie: '+#temporals.format(r.occurrence,'dd.MM.yyyy')}"></small><div class="reminder-actions"><form class="reminder-action" th:action="@{/notes/reminders/{id}(id=${r.id})}" method="post"><input type="hidden" name="revision" th:value="${r.revision}"><input type="hidden" name="occurrence" th:value="${r.occurrence}"><input type="hidden" name="action" value="done"><button type="submit" class="button secondary" th:text="${r.frequency == 'ONCE' ? 'Zrobione' : 'Zrobione na dziś'}"></button></form><form class="reminder-action reminder-snooze" th:action="@{/notes/reminders/{id}(id=${r.id})}" method="post"><input type="hidden" name="revision" th:value="${r.revision}"><input type="hidden" name="occurrence" th:value="${r.occurrence}"><input type="hidden" name="action" value="snooze"><label class="sr-only" th:for="${'snooze-'+r.id}">Odłóż przypomnienie</label><select name="minutes" th:id="${'snooze-'+r.id}"><option value="15">15 min</option><option value="60" selected>1 godz.</option><option value="180">3 godz.</option></select><button class="text-button" type="submit">Odłóż</button></form></div></article></body></html>
