<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notatki i cele · ncLEAN</title><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><link rel="stylesheet" href="/css/interface.css"><link rel="stylesheet" href="/css/notes.css"><script src="/js/notes.js" defer></script><script src="/js/app.js" defer></script><script src="/js/interface.js" defer></script><th:block th:replace="~{fragments/theme :: assets}"></th:block></head><body><header th:replace="~{fragments/navigation :: header('settings')}"></header><main class="main records notes-page"><div class="notes-heading"><div><h1>Notatki i cele</h1><p class="page-intro">Zapisz myśl. Odhacz zadanie. Wróć do ważnych rzeczy.</p></div><button type="button" class="button primary" data-note-new>+ Wpis</button></div><nav class="notes-tabs" aria-label="Stan wpisów"><a th:each="e:${ {'active':'Aktywne','done':'Ukończone','archived':'Archiwum'} }" th:href="@{/notes(state=${e.key},q=${q},pinned=${pinned})}" th:text="${e.value}" th:attr="aria-current=${state == e.key ? 'page' : null}"></a></nav><form class="notes-search" action="/notes" method="get"><input type="hidden" name="state" th:value="${state}"><label>Szukaj w tytule lub treści<input type="search" name="q" maxlength="120" th:value="${q}" autocomplete="off"></label><button class="button secondary" type="submit">Szukaj</button><label class="check"><input name="pinned" type="checkbox" value="true" th:checked="${pinned}">Tylko przypięte</label></form><p class="note-live" role="status"></p><p class="notes-empty" th:if="${notes.entries.empty}">Brak wpisów dla tego widoku. Dodaj pierwszą notatkę lub zmień filtr.</p><div class="notes-list"><th:block th:each="entry:${notes.entries}"><article th:replace="~{notes/fragments :: card(${entry},false)}"></article></th:block></div><nav class="notes-pagination" aria-label="Strony wpisów"><a class="text-link" th:if="${notes.page gt 0}" th:href="@{/notes(state=${state},q=${q},pinned=${pinned},page=${notes.page-1})}">← Poprzednie</a><span th:text="${notes.total+' wpisów'}"></span><a class="text-link" th:if="${notes.more()}" th:href="@{/notes(state=${state},q=${q},pinned=${pinned},page=${notes.page+1})}">Następne →</a></nav></main><dialog th:replace="~{notes/fragments :: dialog}"></dialog></body></html>
