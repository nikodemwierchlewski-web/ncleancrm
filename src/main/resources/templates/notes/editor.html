<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><body><form id="note-form" class="note-form" th:action="@{/notes}" method="post" th:fragment="form"><input name="id" type="hidden" th:value="${noteDraft.id}"><input name="version" type="hidden" th:value="${noteDraft.version}"><input name="token" type="hidden" th:value="${noteDraft.token}"><label>Rodzaj<select name="kind" id="note-kind"><option value="NOTE" th:selected="${noteDraft.kind == 'NOTE'}">Notatka</option><option value="TASK" th:selected="${noteDraft.kind == 'TASK'}">Zadanie</option><option value="GOAL" th:selected="${noteDraft.kind == 'GOAL'}">Cel</option></select></label><label>Tytuł<input name="title" maxlength="160" required autocomplete="off" th:value="${noteDraft.title}" placeholder="Co chcesz zapamiętać?"></label><label>Treść — opcjonalnie<textarea name="content" rows="4" maxlength="5000" th:text="${noteDraft.content}"></textarea></label><div class="note-extra-fields"><label>Termin — opcjonalnie<input name="due" type="date" min="2000-01-01" max="2100-12-31" th:value="${noteDraft.due}"></label><label class="check"><input name="pinned" type="checkbox" th:checked="${noteDraft.pinned}">Przypnij do dashboardu</label></div><section id="note-steps-section" th:hidden="${noteDraft.kind != 'GOAL' and noteDraft.steps.empty}"><h3>Kroki celu — opcjonalnie</h3><p class="field-help">Odhaczanie kroków nie kończy celu automatycznie. Maksymalnie 30 kroków.</p><ol id="note-steps"><li th:each="step,i:${noteDraft.steps}" class="note-step-editor"><input type="hidden" data-step-id th:name="${'step_id_'+i.index}" th:value="${step.id}"><label class="sr-only" th:for="${'step-done-'+i.index}">Krok ukończony</label><input type="checkbox" data-step-done th:id="${'step-done-'+i.index}" th:name="${'step_done_'+i.index}" th:checked="${step.done}"><label class="sr-only" th:for="${'step-text-'+i.index}">Treść kroku</label><input data-step-text th:id="${'step-text-'+i.index}" th:name="${'step_text_'+i.index}" maxlength="300" required th:value="${step.text}"><button type="button" class="icon-button" data-remove-step aria-label="Usuń krok">×</button></li></ol><button type="button" class="button secondary" id="add-note-step">+ Krok</button></section><footer class="note-submit"><p class="note-error" role="alert"></p><button class="button primary" type="submit">Zapisz</button></footer></form></body></html>
