<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<article class="memo-card" th:fragment="card(entry,compact)" th:attr="data-note-id=${entry.id}" th:classappend="${entry.completed ? 'memo-complete' : ''}"><div class="memo-top"><span class="memo-kind" th:text="${entry.label()}"></span><span class="memo-pin" th:if="${entry.pinned}">Przypięte</span><span th:if="${entry.archived}">Archiwum</span></div><div class="memo-title-row"><form class="note-action memo-toggle" th:if="${entry.kind == 'TASK' and !entry.archived}" th:action="@{/notes/{id}/action(id=${entry.id})}" method="post"><input name="version" type="hidden" th:value="${entry.version}"><input name="action" type="hidden" th:value="${entry.completed ? 'reopen' : 'done'}"><label class="memo-checkbox"><input type="checkbox" data-note-toggle th:checked="${entry.completed}" th:attr="aria-label=${entry.completed ? 'Przywróć zadanie: '+entry.title : 'Ukończ zadanie: '+entry.title}"><span class="sr-only">Zmień ukończenie</span></label></form><a class="memo-open" data-note-edit th:href="@{/notes/editor(id=${entry.id})}" th:text="${entry.title}"></a></div><p class="memo-preview" th:if="${!compact and !#strings.isEmpty(entry.content)}" th:text="${#strings.abbreviate(entry.content,180)}"></p><p class="memo-date" th:if="${entry.due != null}" th:classappend="${entry.overdue() ? 'memo-overdue' : ''}"><span th:text="${entry.kind == 'NOTE' ? 'Data: ' : (entry.overdue() ? 'Po terminie: ' : 'Termin: ')}"></span><time th:text="${#temporals.format(entry.due,'dd.MM.yyyy')}"></time></p><p class="memo-progress" th:if="${entry.kind == 'GOAL' and !entry.steps.empty}" th:text="${entry.doneSteps()+' z '+entry.steps.size()+' kroków'}"></p><div class="memo-steps" th:if="${!compact and entry.kind == 'GOAL' and !entry.archived}"><form class="note-action" th:each="step:${entry.steps}" th:action="@{/notes/{id}/action(id=${entry.id})}" method="post"><input name="version" type="hidden" th:value="${entry.version}"><input name="action" type="hidden" value="step"><input name="step" type="hidden" th:value="${step.id}"><input name="checked" type="hidden" th:value="${!step.done}"><label class="memo-step-check"><input type="checkbox" data-note-toggle th:checked="${step.done}"><span th:text="${step.text}"></span></label></form></div><div class="memo-actions"><form class="note-action" th:if="${!entry.archived}" th:action="@{/notes/{id}/action(id=${entry.id})}" method="post"><input name="version" type="hidden" th:value="${entry.version}"><input name="action" type="hidden" th:value="${entry.pinned ? 'unpin' : 'pin'}"><button class="text-button" type="submit" th:text="${entry.pinned ? 'Odepnij' : 'Przypnij'}"></button></form><form class="note-action" th:if="${!compact and entry.kind == 'GOAL' and !entry.archived}" th:action="@{/notes/{id}/action(id=${entry.id})}" method="post"><input name="version" type="hidden" th:value="${entry.version}"><input name="action" type="hidden" th:value="${entry.completed ? 'reopen' : 'done'}"><button class="text-button" type="submit" th:text="${entry.completed ? 'Przywróć do aktywnych' : 'Cel osiągnięty'}"></button></form><form class="note-action" th:if="${!compact}" th:action="@{/notes/{id}/action(id=${entry.id})}" method="post"><input name="version" type="hidden" th:value="${entry.version}"><input name="action" type="hidden" th:value="${entry.archived ? 'restore' : 'archive'}"><button class="text-button" type="submit" th:text="${entry.archived ? 'Przywróć z archiwum' : 'Archiwizuj'}"></button></form></div><p class="note-error" role="alert"></p></article>
<dialog id="note-editor" class="notes-dialog records" aria-labelledby="note-editor-heading" th:fragment="dialog"><header><h2 id="note-editor-heading">Notatka lub cel</h2><button type="button" class="icon-button" data-note-close aria-label="Zamknij edycję">×</button></header><div id="note-editor-content"></div></dialog>
<section class="pinned-notes" th:fragment="pinned"><header><h2>Przypięte</h2><button type="button" class="button secondary" data-note-new data-default-pin="true">+ Notatka</button></header><p class="field-help" th:if="${pinnedNotes.empty}">Przypnij ważną myśl, zadanie lub cel, żeby mieć je pod ręką.</p><div class="pinned-grid"><th:block th:each="entry:${pinnedNotes}"><article th:replace="~{notes/fragments :: card(${entry},true)}"></article></th:block></div><a class="text-link" th:href="@{/notes(pinned=true)}" th:text="${'Pokaż wszystkie przypięte ('+pinnedNoteCount+')'}"></a><p class="note-live" role="status"></p></section>
</body></html>
