<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><article th:fragment="row(e)" class="expense-row" th:classappend="${e.cancelled ? 'expense-cancelled' : ''}" th:attr="data-cost-id=${e.source+'-'+e.id}"><div class="expense-top"><time th:text="${#dates.format(e.spent_on,'dd.MM.yyyy')}"></time><span th:text="${e.source == 'FUEL' ? 'Paliwo' : categories.get(e.category)}"></span><strong th:text="${#numbers.formatDecimal(e.amount,1,'WHITESPACE',2,'COMMA')+' zł'}"></strong></div><a class="expense-title" th:href="${e.source == 'FUEL' ? '/fuel?date='+e.spent_on+'&amp;purchase='+e.id+'#purchase-form' : '/costs/editor?id='+e.id}" th:attr="data-cost-edit=${e.source == 'EXPENSE' ? 'true' : null}" th:text="${e.title}"></a><p th:if="${!#strings.isEmpty(e.supplier)}" th:text="${e.supplier}"></p><p th:if="${e.odometer != null}" th:text="${'Przebieg informacyjny: '+e.odometer+' km'}"></p><p th:if="${e.quantity != null}" th:text="${'Ilość: '+e.quantity+(e.source == 'FUEL' ? ' l' : ' · kwota łączna')}"></p><p th:if="${e.effect == 'COVERED'}" th:text="${'Już ujęte w kosztach miesięcznych: '+e.covered_month+' · '+e.covered_category}"></p><p th:if="${e.effect == 'INVESTMENT'}">Inwestycja — poza wynikiem operacyjnym</p><p th:if="${e.category == 'CHEMISTRY'}">Zakup chemii — zużycie rozliczamy na zleceniach</p><p th:if="${e.asset_id != null}"><a class="text-link" th:href="@{/costs/equipment/{id}(id=${e.asset_id},month=${month},range=${range},view=${view},q=${q},cancelled=${cancelled})}">Historia sprzętu →</a></p><p th:if="${e.cancelled}" th:text="${'Anulowane: '+e.cancel_reason}"></p><div class="expense-links"><a class="text-link" th:if="${e.receipt_id != null}" th:href="@{/fuel/receipts/{id}(id=${e.receipt_id})}" target="_blank" rel="noopener">Rachunek ↗</a><details th:if="${!e.cancelled}"><summary>Anuluj błędny wpis</summary><form class="cost-action" th:action="${e.source == 'FUEL' ? '/costs/fuel/'+e.id+'/cancel' : '/costs/'+e.id+'/cancel'}" method="post"><input name="version" type="hidden" th:value="${e.version}"><label>Powód anulowania<input name="reason" required maxlength="300"></label><button class="button secondary" type="submit">Potwierdź anulowanie</button><p class="cost-error-message" role="alert"></p></form></details></div></article>
<dialog id="cost-editor" class="cost-dialog records" aria-labelledby="cost-editor-heading" th:fragment="dialog"><header><h2 id="cost-editor-heading">Wydatek</h2><button type="button" class="icon-button" data-cost-close aria-label="Zamknij formularz">×</button></header><div id="cost-editor-content"></div></dialog></body></html>
