<!doctype html><html lang="pl" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historia sprzętu · ncLEAN</title><link rel="stylesheet" href="/css/crm.css"><link rel="stylesheet" href="/css/records.css"><link rel="stylesheet" href="/css/interface.css"><link rel="stylesheet" href="/css/costs.css"><script src="/js/costs.js" defer></script><script src="/js/app.js" defer></script><script src="/js/interface.js" defer></script><th:block th:replace="~{fragments/theme :: assets}"></th:block></head><body><header th:replace="~{fragments/navigation :: header('settings')}"></header><main class="main records costs-main asset-main"><header class="costs-heading"><h1 th:text="${asset.name}"></h1><button class="button primary" type="button" data-cost-new th:attr="data-asset=${asset.id}" th:disabled="${!asset.active}">+ Serwis / wydatek</button></header><a class="text-link" th:href="@{/costs(month=${month},range=${range},view=${view},q=${q},cancelled=${cancelled})}">← Powrót do kosztów</a><p th:if="${!asset.active}" class="notice">Sprzęt nieaktywny. Cała historia pozostaje dostępna.</p><div class="cost-kpis"><section><small>Zakupy tego sprzętu</small><strong th:text="${summary.purchase_total+' zł'}"></strong></section><section><small>Rachunki utrzymania</small><strong th:text="${summary.maintenance_total+' zł'}"></strong><p>Nie dodajemy ich ponownie do kosztów miesięcznych.</p></section></div><p class="cost-live" role="status"></p><details class="asset-edit"><summary>Dane sprzętu, gwarancja i aktywność</summary><form class="asset-form" th:action="@{/costs/equipment/{id}(id=${asset.id})}" method="post"><input name="version" type="hidden" th:value="${asset.version}"><label>Nazwa<input name="name" required maxlength="160" th:value="${asset.name}"></label><label>Kategoria<input name="category" maxlength="100" th:value="${asset.category}"></label><label>Model<input name="model" maxlength="160" th:value="${asset.model}"></label><label>Numer seryjny<input name="serial_number" maxlength="160" th:value="${asset.serial_number}"></label><label>Gwarancja do<input name="warranty_until" type="date" min="2000-01-01" max="2100-12-31" th:value="${asset.warranty_until}"></label><label>Sprzedawca<input name="supplier" maxlength="160" th:value="${asset.supplier}"></label><label>Notatka<textarea name="note" maxlength="2000" rows="2" th:text="${asset.note}"></textarea></label><label class="check"><input name="active" type="checkbox" th:checked="${asset.active}">Sprzęt aktywny</label><button class="button primary" type="submit">Zapisz dane sprzętu</button><p class="cost-error-message" role="alert"></p></form></details><form th:replace="~{fragments/removal :: action('equipment',${asset.id},${asset.version},${asset.name},${!asset.active})}"></form><h2>Historia zakupów i serwisu</h2><div class="expense-list"><th:block th:each="e:${history}"><article th:replace="~{costs/fragments :: row(${e})}"></article></th:block></div></main><dialog th:replace="~{costs/fragments :: dialog}"></dialog></body></html>
