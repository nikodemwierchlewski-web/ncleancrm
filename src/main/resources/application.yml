server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: NCLEAN_CRM_SESSION
        http-only: true
        same-site: strict
spring:
  application:
    name: nclean-crm
  datasource:
    url: ${CRM_DB_URL}
    username: ${CRM_DB_USERNAME}
    password: ${CRM_DB_PASSWORD}
  flyway:
    enabled: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
crm:
  admin:
    username: ${CRM_ADMIN_USERNAME}
    password-hash: ${CRM_ADMIN_PASSWORD_HASH}
