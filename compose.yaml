name: ncleancrm-local

services:
  postgres:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    entrypoint: ["/bin/sh", "/usr/local/bin/nclean-postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: nclean_crm
      POSTGRES_USER: crm_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - crm_db_password
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/entrypoint.sh:/usr/local/bin/nclean-postgres-entrypoint.sh:ro
      - ./docker/postgres/init-crm.sh:/docker-entrypoint-initdb.d/10-crm.sh:ro
    tmpfs:
      - /run/crm-init
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /run/secrets/crm_db_password)\" psql -h 127.0.0.1 -U crm_dev -d nclean_crm -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:

secrets:
  postgres_admin_password:
    file: ./.local/postgres-admin-password
  crm_db_password:
    file: ./.local/postgres-password
