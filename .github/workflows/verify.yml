name: Verify CRM
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['nclean-v*-test.*', 'nclean-v*-final.*']
  schedule:
    - cron: '25 7 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: URL and service-worker isolation checks
        run: node scripts/test-web-boundaries.cjs
      - name: Unit, MVC and isolated PostgreSQL integration tests
        run: ./mvnw -B -ntp verify
      - name: Known vulnerability checks with documented applicability
        run: |
          ./mvnw -B -ntp dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 scripts/check-dependencies.py target/runtime-dependencies.txt
      - name: Browser regression on a disposable database
        run: |
          python3 -m pip install playwright==1.58.0 bcrypt==5.0.0
          python3 -m playwright install --with-deps chromium
          crm_chromium="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python3 scripts/verify-equipment-live.py --work-dir "$RUNNER_TEMP/crm-audit" --chromium "$crm_chromium" --audit-fixes-only
          python3 scripts/verify-equipment-live.py --work-dir "$RUNNER_TEMP/crm-jobs" --chromium "$crm_chromium" --job-defaults-only
          python3 scripts/verify-equipment-live.py --work-dir "$RUNNER_TEMP/crm-insights" --chromium "$crm_chromium" --customer-insights-only --context-path ''
      - name: PowerShell update recovery scenarios without a real installation
        run: python3 scripts/test-pc-update.py --pwsh pwsh --work-dir "$RUNNER_TEMP/crm-pc-update"
      - name: Build the exact application image
        run: docker build --tag ncleancrm-ci:${{ github.sha }} .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
            target/dependency-security.json
          retention-days: 7
